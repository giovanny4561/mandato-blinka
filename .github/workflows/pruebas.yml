name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: poppler (pdftoppm, igual que el Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -p no:warnings
