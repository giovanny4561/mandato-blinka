[project]
name = "mandato"
version = "0.1.0"
description = "Agente de cuentas por pagar que decide PAGAR / ESCALAR / FRENAR dentro de un mandato (Hackathon 30X · reto Blinka)"
requires-python = ">=3.12"
license = { text = "Todos los derechos reservados" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=4.3",
  "reportlab>=4.2",
  "pillow>=10.4",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
  "mcp==1.30.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
